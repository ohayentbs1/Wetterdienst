{% extends 'base.html' %}

{% block content %}
<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
    <h1 class="text-2xl font-bold text-white mb-2">Willkommen beim Wetterdienst</h1>
    <p class="text-slate-400">Das Flask-Projekt mit SQLite3, SQLAlchemy und Tailwind CSS v4 steht!</p>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <p class="mt-4 text-emerald-400">{{ messages|join(' ') }}</p>
        {% endif %}
    {% endwith %}
    <form action="{{ url_for('main.import_stations') }}" method="post" class="mt-6">
        <button type="submit" class="rounded-lg bg-sky-500 px-4 py-2 font-semibold text-white hover:bg-sky-400">
            Stationen importieren
        </button>
    </form>
</div>
{% endblock %}
