<section class="mt-8 rounded-xl border p-4" aria-labelledby="weather-table-title">
    <h2 id="weather-table-title" class="mb-4 text-lg font-semibold ">
        Gewichtete Wetterwerte vom {{ start_date }} bis {{ end_date }}
    </h2>

    <div class="overflow-x-auto">
        <table class="min-w-full border-collapse border text-left text-sm">
            <thead>
                <tr>
                    <th class="border px-3 py-2">Datum</th>
                    <th class="border px-3 py-2">{{ table_data.label }} ({{ table_data.unit }})</th>
                </tr>
            </thead>
            <tbody>
                {% for row in table_data.rows %}
                    <tr class="odd:bg-gray-300-900 even:bg-white">
                        <td class="border px-3 py-2">{{ row.date }}</td>
                        <td class="border px-3 py-2">
                            {% if row.value is not none %}
                                {{ '%.2f'|format(row.value)|replace('.', ',') }}
                            {% else %}
                                -
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
