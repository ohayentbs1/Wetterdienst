<div class="mb-4 flex flex-wrap items-center gap-3">
    <form method="post" action="{{ url_for('main.change_weather_data') }}" class="w-full">
        <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-950 p-3">
            <div class="inline-flex overflow-hidden rounded-lg border border-slate-700 bg-slate-900">
                <button type="submit"
                        name="display_mode"
                        value="chart"
                        class="px-4 py-2 text-sm font-medium transition {% if selected_display_mode == 'chart' or selected_display_mode is not defined %}bg-sky-500 text-white{% else %}bg-slate-900 text-slate-300 hover:bg-slate-800{% endif %}">
                    Graph
                </button>
                <button type="submit"
                        name="display_mode"
                        value="table"
                        class="px-4 py-2 text-sm font-medium transition {% if selected_display_mode == 'table' %}bg-sky-500 text-white{% else %}bg-slate-900 text-slate-300 hover:bg-slate-800{% endif %}">
                    Tabelle
                </button>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="flex flex-col gap-1 text-sm text-slate-300">
                    Wetterkategorie
                    <select name="weather_category"
                            class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-white">
                        {% for key, (label, unit) in chart_service_fields.items() %}
                            <option value="{{ key }}" {% if selected_weather_category == key %}selected{% endif %}>
                                {{ label }} ({{ unit }})
                            </option>
                        {% endfor %}
                    </select>
                </label>
                <button type="submit"
                        class="rounded-lg bg-sky-500 px-4 py-2 font-semibold text-white hover:bg-sky-400">
                    Anzeigen
                </button>
            </div>
        </div>
    </form>
</div>
